# Named 56-: must sort after 53-konkr-audio.conf, which matches the same card name and forces UCM HiFi (no speaker on TB710FU -> Steam libaudio SEGV).
# TB710FU: no UCM profile for the Lenovo-TB710FU card -> use pro-audio;
# pro-output-0 = MultiMedia1 = speakers (SECONDARY TDM, 4x AW882xx).
# The front end is stereo only; the kernel's MFC map (audioreach.c, tb710fu) copies
# L/R onto TDM slots 0,2 / 1,3 = amps 0x34+0x36 (left) and 0x35+0x37 (right).
# Never suspend it: every resume restarts the 4 amps, whose PLL lock against the TDM
# clock fails intermittently (40 of 52 starts on 10/20) -> sound sometimes missing.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = { update-props = { api.alsa.use-ucm = false, api.alsa.split-enable = false, api.acp.auto-profile = false, api.acp.auto-port = false, device.profile = "pro-audio" } }
  }
  {
    matches = [ { node.name = "alsa_output.platform-sound.pro-output-0" } ]
    actions = { update-props = { node.description = "TB710FU 扬声器", node.nick = "Speakers", priority.session = 2000, priority.driver = 2000, audio.format = "S16LE", audio.rate = 48000, audio.channels = 2, api.alsa.period-size = 1024, session.suspend-timeout-seconds = 0 } }
  }
]
