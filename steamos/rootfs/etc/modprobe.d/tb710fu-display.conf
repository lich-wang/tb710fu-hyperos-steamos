# TB710FU: dispcc probe reconfigures the display PLLs and kills the ABL scanout (simpledrm)
blacklist dispcc_sm8550
install dispcc_sm8550 /bin/false
# The panel stack is loaded in a fixed order by tb-native-display.service (aw37503 ->
# sy7758 -> dispcc -> panel -> msm, then one DRM off/on for the NT36532 latch race);
# keep udev from loading any of it earlier.
blacklist msm
blacklist panel_nt36532_wqhd_dual_dsi_dsc
blacklist sy7758
blacklist aw37503_regulator
install msm /bin/false
install panel_nt36532_wqhd_dual_dsi_dsc /bin/false
install sy7758 /bin/false
install aw37503_regulator /bin/false
